<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abacus Convention Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>
  <body>
    <header>
      <!-- Navbar starts -->
      <nav class="navbar" role="navigation" aria-label="Main Navigation">
        <div class="navbar-flex container">
          <a class="logo" href="#home">Abacus Convention Center</a>
          <div class="main-menu-items">
            <ul class="main-menu-list">
              <li><a href="#home">Home</a></li>
              <li><a href="#about">About Us</a></li>
              <li><a href="#packages">Packages</a></li>
              <li><a href="#contact">Contact</a></li>
            </ul>
          </div>

          <!-- Mobile Menu -->
          <div class="mobile-menu">
            <!-- Hamburger button -->
            <div
              class="mobile-menu-toggle"
              role="button"
              aria-expanded="false"
              aria-controls="mobile-menu-items"
              aria-label="Open mobile menu"
              tabindex="0"
            >
              <i class="fas fa-bars fa-2x"></i>
            </div>
            <!-- Mobile Menu Items -->
            <div class="mobile-menu-items">
              <ul class="mobile-menu-list">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About Us</a></li>
                <li><a href="#packages">Packages</a></li>
                <li><a href="#contact">Contact</a></li>
              </ul>
            </div>
          </div>
        </div>
      </nav>
      <!-- Navbar ends -->

      <!-- Hero Starts -->
      <section class="hero" id="home">
        <div class="container hero-content hero-flex">
          <div class="hero-heading">
            <h1>The perfect venue for your next event</h1>
          </div>

          <div class="hero-text">
            <p>
              Amet minim mollit non deserunt ullamco est sit aliqua dolor do
              amet sint. Velit officia consequat duis enim velit.
            </p>
          </div>

          <div class="btn">
            <a href="#packages">Book Now</a>
          </div>
        </div>
      </section>
      <!-- Hero Endss -->
    </header>

    <script src="js/script.js"></script>
  </body>
</html>
